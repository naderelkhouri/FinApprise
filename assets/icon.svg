<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1324" />
    </linearGradient>

    <!-- Emerald Teal Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" filter="url(#dropShadow)" stroke="#334155" stroke-width="4" />

  <!-- Subtle Inner Grid Lines -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="80" y1="280" x2="432" y2="280" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="80" y1="200" x2="432" y2="200" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Accounting Bars Group -->
  <!-- Bar 1 -->
  <rect x="100" y="270" width="42" height="130" rx="10" fill="#334155" opacity="0.6" />
  <!-- Bar 2 -->
  <rect x="164" y="210" width="42" height="190" rx="10" fill="url(#cyanGrad)" opacity="0.75" />
  <!-- Bar 3 -->
  <rect x="228" y="250" width="42" height="150" rx="10" fill="#475569" opacity="0.6" />
  <!-- Bar 4 -->
  <rect x="292" y="160" width="42" height="240" rx="10" fill="url(#emeraldGrad)" />
  <!-- Bar 5 -->
  <rect x="356" y="110" width="42" height="290" rx="10" fill="url(#goldGrad)" />

  <!-- Dynamic Upward Financial Growth Line Curve -->
  <path d="M 115 310 Q 185 240, 245 270 T 313 180 T 385 120" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="7" 
        stroke-linecap="round" 
        filter="url(#glowEffect)" />

  <!-- Glowing Trend Indicator Point -->
  <circle cx="385" cy="120" r="14" fill="#ffffff" filter="url(#glowEffect)" />
  <circle cx="385" cy="120" r="8" fill="#fbbf24" />

  <!-- Stylized Currency / Balance Symbol (Top Left) -->
  <g transform="translate(90, 80) scale(0.95)">
    <circle cx="35" cy="35" r="32" fill="#10b981" fill-opacity="0.15" stroke="url(#emeraldGrad)" stroke-width="3" />
    <text x="35" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#34d399" text-anchor="middle">R$</text>
  </g>

  <!-- FinApprise Brand Tag (Bottom) -->
  <text x="256" y="445" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="5" 
        fill="#f8fafc" 
        text-anchor="middle">FINAPPRISE</text>
  
  <text x="256" y="468" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" 
        font-weight="600" 
        letter-spacing="3" 
        fill="#94a3b8" 
        text-anchor="middle">CONTABILIDADE &amp; GESTÃO</text>
</svg>
